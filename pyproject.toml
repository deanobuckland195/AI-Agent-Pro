[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-pro"
version = "1.0.0"
description = "A local AI agent platform with bounded execution and durable conversations"
requires-python = ">=3.11"
dependencies = ["streamlit>=1.50,<2", "altair>=5,<7", "openai>=2.54,<3", "httpx>=0.28.1,<1", "pypdf>=7.0.0,<8", "numpy>=2,<3", "psutil>=7,<8", "mistune>=3.4,<4", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10"]
browser = ["playwright>=1.50,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
